<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Ilustración de navaja y brocha de afeitar">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#101010"/>
    </radialGradient>
    <linearGradient id="gold4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3c374"/>
      <stop offset="100%" stop-color="#a9822f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg4)"/>
  <circle cx="180" cy="150" r="200" fill="#c9a24b" opacity="0.06"/>
  <circle cx="1040" cy="540" r="220" fill="#c9a24b" opacity="0.06"/>

  <!-- shaving brush (left) -->
  <g transform="translate(490 400) rotate(-12)">
    <rect x="-22" y="0" width="44" height="130" rx="16" fill="url(#gold4)" stroke="#101010" stroke-width="4"/>
    <path d="M -60 0 Q 0 -110 60 0 Z" fill="#e8e2d6" stroke="#101010" stroke-width="4"/>
    <path d="M -40 -4 Q 0 -70 40 -4 Z" fill="#cfc6b2"/>
  </g>

  <!-- straight razor (right) -->
  <g transform="translate(700 400) rotate(14)">
    <rect x="-20" y="10" width="40" height="120" rx="14" fill="#2f2f2f" stroke="#101010" stroke-width="4"/>
    <path d="M -18 10 C -18 -70 20 -140 46 -170 C 30 -120 10 -50 18 10 Z" fill="url(#gold4)" stroke="#101010" stroke-width="4"/>
  </g>
</svg>
