<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Ilustración de tijeras y peine de barbería">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#101010"/>
    </radialGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3c374"/>
      <stop offset="100%" stop-color="#a9822f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>
  <circle cx="150" cy="120" r="200" fill="#c9a24b" opacity="0.06"/>
  <circle cx="1080" cy="560" r="220" fill="#c9a24b" opacity="0.06"/>

  <!-- comb -->
  <g transform="translate(600 340) rotate(-35)">
    <rect x="-190" y="-24" width="380" height="48" rx="10" fill="url(#gold2)" opacity="0.9"/>
    <g stroke="#101010" stroke-width="6">
      <line x1="-170" y1="24" x2="-170" y2="70"/>
      <line x1="-140" y1="24" x2="-140" y2="70"/>
      <line x1="-110" y1="24" x2="-110" y2="70"/>
      <line x1="-80" y1="24" x2="-80" y2="70"/>
      <line x1="-50" y1="24" x2="-50" y2="70"/>
      <line x1="-20" y1="24" x2="-20" y2="70"/>
      <line x1="10" y1="24" x2="10" y2="70"/>
      <line x1="40" y1="24" x2="40" y2="70"/>
      <line x1="70" y1="24" x2="70" y2="70"/>
      <line x1="100" y1="24" x2="100" y2="70"/>
      <line x1="130" y1="24" x2="130" y2="70"/>
      <line x1="160" y1="24" x2="160" y2="70"/>
    </g>
  </g>

  <!-- scissors -->
  <g transform="translate(600 340) rotate(30)">
    <path d="M -20 -10 L 220 -60 L 210 -30 L -10 20 Z" fill="url(#gold2)" stroke="#101010" stroke-width="4"/>
    <path d="M -20 10 L 220 60 L 210 30 L -10 -20 Z" fill="url(#gold2)" stroke="#101010" stroke-width="4"/>
    <circle cx="-40" cy="-30" r="34" fill="none" stroke="url(#gold2)" stroke-width="12"/>
    <circle cx="-40" cy="30" r="34" fill="none" stroke="url(#gold2)" stroke-width="12"/>
    <circle cx="-8" cy="0" r="10" fill="#101010"/>
  </g>
</svg>
