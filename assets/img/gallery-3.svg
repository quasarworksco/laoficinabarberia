<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Ilustración de una silla de barbería clásica">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#101010"/>
    </radialGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3c374"/>
      <stop offset="100%" stop-color="#a9822f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)"/>
  <circle cx="1030" cy="120" r="200" fill="#c9a24b" opacity="0.06"/>
  <circle cx="160" cy="580" r="180" fill="#c9a24b" opacity="0.06"/>

  <!-- shadow -->
  <ellipse cx="600" cy="560" rx="220" ry="24" fill="#000" opacity="0.4"/>

  <!-- base -->
  <path d="M 480 555 L 720 555 L 660 520 L 540 520 Z" fill="url(#gold3)" stroke="#101010" stroke-width="4"/>
  <rect x="588" y="440" width="24" height="90" fill="url(#gold3)" stroke="#101010" stroke-width="4"/>

  <!-- seat -->
  <rect x="470" y="400" width="260" height="46" rx="16" fill="url(#gold3)" stroke="#101010" stroke-width="4"/>

  <!-- backrest -->
  <rect x="470" y="200" width="60" height="210" rx="18" fill="url(#gold3)" stroke="#101010" stroke-width="4"/>

  <!-- headrest -->
  <rect x="474" y="160" width="52" height="50" rx="14" fill="url(#gold3)" stroke="#101010" stroke-width="4"/>

  <!-- armrest -->
  <rect x="700" y="360" width="70" height="24" rx="10" fill="url(#gold3)" stroke="#101010" stroke-width="4"/>
  <rect x="740" y="360" width="20" height="70" rx="8" fill="url(#gold3)" stroke="#101010" stroke-width="4"/>

  <!-- footrest -->
  <rect x="640" y="500" width="120" height="20" rx="8" fill="url(#gold3)" stroke="#101010" stroke-width="4"/>
  <rect x="690" y="440" width="18" height="70" fill="url(#gold3)" stroke="#101010" stroke-width="4"/>
</svg>
