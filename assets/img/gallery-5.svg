<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Ilustración de un espejo de barbería con luces">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#101010"/>
    </radialGradient>
    <linearGradient id="gold5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3c374"/>
      <stop offset="100%" stop-color="#a9822f"/>
    </linearGradient>
    <radialGradient id="bulb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#c9a24b"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg5)"/>
  <circle cx="1030" cy="560" r="200" fill="#c9a24b" opacity="0.06"/>
  <circle cx="170" cy="120" r="180" fill="#c9a24b" opacity="0.06"/>

  <!-- mirror -->
  <ellipse cx="600" cy="380" rx="190" ry="220" fill="#1a1a1a" stroke="url(#gold5)" stroke-width="18"/>
  <ellipse cx="600" cy="380" rx="150" ry="180" fill="#232323" opacity="0.7"/>

  <!-- string lights -->
  <path d="M 340 200 Q 600 60 860 200" fill="none" stroke="url(#gold5)" stroke-width="4"/>
  <g>
    <circle cx="380" cy="184" r="12" fill="url(#bulb)"/>
    <circle cx="460" cy="140" r="12" fill="url(#bulb)"/>
    <circle cx="540" cy="112" r="12" fill="url(#bulb)"/>
    <circle cx="620" cy="105" r="12" fill="url(#bulb)"/>
    <circle cx="700" cy="118" r="12" fill="url(#bulb)"/>
    <circle cx="780" cy="152" r="12" fill="url(#bulb)"/>
    <circle cx="840" cy="192" r="12" fill="url(#bulb)"/>
  </g>
</svg>
